name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and its full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: A minimal file, repository or input that shows the problem.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. 0.7.3"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node/Go version, CI provider"
